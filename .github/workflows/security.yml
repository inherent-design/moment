name: Dependency and source security
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '32 7 * * *'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: '2026.11.9'
          install: false
      - run: mise -E security install
      - run: mise -E security exec -- pnpm install --frozen-lockfile
      - run: mise -E security exec -- pnpm check:renovate
      - run: mise -E security exec -- pnpm check:ci
      - run: mise -E security exec -- pnpm security:scan
