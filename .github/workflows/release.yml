name: Publish qualified npm preview
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
  publish:
    needs: qualify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check immutable tag and public identity
        run: |
          node --input-type=module -e "import p from './package.json' with {type:'json'}; if((process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== 'v'+p.version) || p.name !== '@inherent.design/moment' || p.license !== 'Apache-2.0' || p.private) throw Error('Release tag or public identity disagrees')"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: qualified-package-${{ github.sha }}
          path: dist
      - name: Verify the exact qualified artifact without rebuilding it
        run: node scripts/publish-package.mjs --check
      - name: Publish the qualified tarball
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # npm can accept an upload before scanning makes it installable.
        run: node scripts/publish-package.mjs --publish
