[tools]
node = "26.13.0"
"aqua:pnpm/pnpm" = "12.18.0"

[settings.upgrade]
auto_prune = false

[tasks.setup]
description = "Install the exact dependency graph"
run = "pnpm install --frozen-lockfile"

[tasks.check]
description = "Check types, source coherence, unused code, docs and runtime"
run = "pnpm check"

[tasks.test]
description = "Run runtime execution tests"
run = "pnpm test"

[tasks."setup:formal"]
description = "Install pinned Bend and Lean proof tools"
run = "pnpm setup:formal"

[tasks."build:core"]
description = "Compile the authoritative Bend core"
run = "pnpm build:core"

[tasks."test:proof"]
description = "Check Bend verdict and scoped Lean proofs"
run = "pnpm test:proof"

[tasks."check:quick"]
description = "Static/source checks without the runtime or proof suites"
run = "pnpm check:quick"

[tasks."check:ci"]
description = "Validate workflows with the optional security tool profile"
run = "pnpm check:ci"

[tasks."security:scan"]
description = "Scan source and production/development dependency inventory"
run = "pnpm security:scan"
