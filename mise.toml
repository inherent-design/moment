[tools]
node = "26.13.0"
"aqua:pnpm/pnpm" = "12.18.0"

[settings.upgrade]
auto_prune = false

[tasks.setup]
description = "Install the exact dependency graph"
run = "pnpm install --frozen-lockfile"

[tasks.check]
description = "Check contracts, documentation, and runtime tests"
run = "pnpm check"

[tasks.test]
description = "Run runtime execution tests"
run = "pnpm test"

[tasks."setup:formal"]
description = "Install pinned Bend and Lean proof tools"
run = "pnpm setup:formal"

[tasks."build:core"]
description = "Compile the authoritative Bend core"
run = "pnpm build:core"

[tasks."test:proof"]
description = "Check Bend verdict and scoped Lean proofs"
run = "pnpm test:proof"
